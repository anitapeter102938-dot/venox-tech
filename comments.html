<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post | VenoX Tech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="progressBar"></div>

  <header>
    <a href="index.html"><img src="logo.png" alt="VenoX Tech logo"><span>VenoX Tech</span></a>
    <a href="index.html">Home</a>
  </header>

  <main>
    <p class="notice" id="notFound" hidden>This post could not be found. <a href="index.html">Go back home</a></p>

    <div id="postArea">
      <img id="postImage" alt="">
      <h1 id="postTitle"></h1>
      <p id="postName"></p>

      <nav id="tableOfContents" hidden>
        <h3>In this post</h3>
        <ul id="tocList"></ul>
      </nav>

      <div id="postText"></div>

      <div class="actions">
        <button id="likeButton">Like (0)</button>
        <button id="shareButton">Share</button>
      </div>
    </div>

    <p class="notice" id="loginMessage" hidden><a href="login.html">Log in</a> to like and comment.</p>

    <section id="commentSection">
      <h2>Comments (<span id="commentCount">0</span>)</h2>

      <form id="commentForm">
        <textarea id="commentInput"></textarea>
        <p class="error" id="commentError"></p>
        <button type="submit" id="commentButton">Post comment</button>
      </form>

      <div id="commentList"></div>
    </section>
  </main>

  <footer>
    <p>VenoX Tech: Tech, told by people who build it.</p>
    <p><a href="index.html">Home</a> · <a href="about.html">About</a></p>
  </footer>

  <script src="posts.js"></script>
  <script src="storage.js"></script>
  <script>

    const progressBar = document.getElementById("progressBar");
    const notFound = document.getElementById("notFound");
    const postArea = document.getElementById("postArea");
    const postImage = document.getElementById("postImage");
    const postTitle = document.getElementById("postTitle");
    const postName = document.getElementById("postName");
    const tableOfContents = document.getElementById("tableOfContents");
    const tocList = document.getElementById("tocList");
    const postText = document.getElementById("postText");
    const likeButton = document.getElementById("likeButton");
    const shareButton = document.getElementById("shareButton");
    const loginMessage = document.getElementById("loginMessage");
    const commentSection = document.getElementById("commentSection");
    const commentCount = document.getElementById("commentCount");
    const commentForm = document.getElementById("commentForm");
    const commentInput = document.getElementById("commentInput");
    const commentError = document.getElementById("commentError");
    const commentButton = document.getElementById("commentButton");
    const commentList = document.getElementById("commentList");

    let currentPost = null;
    let currentUser = null;

    const allPosts = getAllPosts();

    const postId = new URLSearchParams(window.location.search).get("id");

    for (let i = 0; i < allPosts.length; i++) {
      if (String(allPosts[i].id) === postId) {
        currentPost = allPosts[i];
      }
    }

    const currentEmail = JSON.parse(localStorage.getItem("vx_session")) || "";
    const users = JSON.parse(localStorage.getItem("vx_users")) || [];

    for (let i = 0; i < users.length; i++) {
      if (users[i].email === currentEmail) {
        currentUser = users[i];
      }
    }

    window.addEventListener("scroll", function () {
      const scrolledDistance = window.scrollY;
      const totalScrollable = document.documentElement.scrollHeight - window.innerHeight;

      let percent = 0;
      if (totalScrollable > 0) {
        percent = (scrolledDistance / totalScrollable) * 100;
      }

      progressBar.style.width = percent + "%";
    });

    // Show the post text.
    // Code between ``` becomes a code box. A line starting with ## becomes a section heading.
    function showPostText(fullText) {
      postText.innerHTML = "";
      tocList.innerHTML = "";

      let sectionCount = 0;

      const pieces = fullText.split("```");

      for (let i = 0; i < pieces.length; i++) {
        const piece = pieces[i].trim();

        if (piece === "") {
          continue;
        }

        if (i % 2 === 1) {
          const codeBox = document.createElement("div");
          codeBox.className = "codeBox";

          const copyCodeButton = document.createElement("button");
          copyCodeButton.textContent = "Copy";
          copyCodeButton.onclick = function () {
            navigator.clipboard.writeText(piece);
            copyCodeButton.textContent = "Copied";
          };

          const preBlock = document.createElement("pre");
          const codeText = document.createElement("code");
          codeText.textContent = piece;

          preBlock.appendChild(codeText);
          codeBox.appendChild(copyCodeButton);
          codeBox.appendChild(preBlock);
          postText.appendChild(codeBox);
        } else {

          const lines = piece.split("\n");

          for (let j = 0; j < lines.length; j++) {
            const line = lines[j].trim();

            if (line === "") {
              continue;
            }

            if (line.startsWith("## ")) {

              sectionCount = sectionCount + 1;
              const headingText = line.slice(3);
              const sectionId = "section-" + sectionCount;

              const heading = document.createElement("h2");
              heading.id = sectionId;
              heading.textContent = headingText;
              postText.appendChild(heading);

              const tocItem = document.createElement("li");
              const tocLink = document.createElement("a");
              tocLink.href = "#" + sectionId;
              tocLink.textContent = headingText;
              tocItem.appendChild(tocLink);
              tocList.appendChild(tocItem);
            } else {

              const paragraph = document.createElement("p");
              paragraph.textContent = line;
              postText.appendChild(paragraph);
            }
          }
        }
      }

      if (sectionCount >= 2) {
        tableOfContents.hidden = false;
      }
    }

    function showLikes() {
      let liked = false;
      if (currentUser !== null && currentPost.likes.includes(currentUser.email)) {
        liked = true;
      }

      if (liked) {
        likeButton.textContent = "Liked (" + currentPost.likes.length + ")";
      } else {
        likeButton.textContent = "Like (" + currentPost.likes.length + ")";
      }
    }

    function showComments() {
      commentList.innerHTML = "";
      commentCount.textContent = currentPost.comments.length;

      if (currentPost.comments.length === 0) {
        commentList.textContent = "No comments yet. Be the first to comment.";
        return;
      }

      for (let i = 0; i < currentPost.comments.length; i++) {
        const comment = currentPost.comments[i];

        const box = document.createElement("div");
        box.className = "comment";

        const writer = document.createElement("strong");
        writer.textContent = comment.name;

        const words = document.createElement("p");
        words.textContent = comment.text;

        box.appendChild(writer);
        box.appendChild(words);
        commentList.appendChild(box);
      }
    }

    if (currentPost === null) {
      postArea.hidden = true;
      commentSection.hidden = true;
      notFound.hidden = false;
    } else {
      postImage.src = currentPost.img;
      postImage.alt = "Image for " + currentPost.title;
      postTitle.textContent = currentPost.title;
      postName.textContent = "By " + currentPost.name + " · " + currentPost.date;
      showPostText(currentPost.text);

      showLikes();
      showComments();

      if (currentUser === null) {
        commentInput.disabled = true;
        commentButton.disabled = true;
        commentInput.placeholder = "Log in to write a comment";
        loginMessage.hidden = false;
      }
    }

    likeButton.addEventListener("click", function () {
      if (currentUser === null) {
        loginMessage.hidden = false;
        return;
      }

      const position = currentPost.likes.indexOf(currentUser.email);
      if (position === -1) {
        currentPost.likes.push(currentUser.email);
      } else {
        currentPost.likes.splice(position, 1);
      }

      savePosts(allPosts);
      showLikes();
    });

    shareButton.addEventListener("click", function () {
      navigator.clipboard.writeText(window.location.href)
        .then(function () {
          shareButton.textContent = "Link copied";
        })
        .catch(function () {
          shareButton.textContent = "Copy failed";
        });
    });

    commentForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = commentInput.value.trim();
      if (text === "") {
        commentError.textContent = "Write a comment before you post.";
        return;
      }

      currentPost.comments.unshift({
        name: currentUser.name,
        text: text,
        date: new Date().toDateString()
      });

      savePosts(allPosts);
      commentInput.value = "";
      commentError.textContent = "";
      showComments();
    });
  </script>

</body>
</html>
